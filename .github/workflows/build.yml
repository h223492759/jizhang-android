name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
      - name: Generate Android runner
        run: |
          flutter create --no-pub --platforms=android _gen_tmp
          cp -r _gen_tmp/android .
          rm -rf _gen_tmp
      - name: Apply custom app icons
        run: |
          # 自定义 APP 图标（圆角 PNG，来自 assets/icons/）
          # 删除 flutter create 默认的 vector foreground，避免与 PNG 同名冲突
          rm -f android/app/src/main/res/drawable/ic_launcher_foreground.xml \
                android/app/src/main/res/drawable-v21/ic_launcher_foreground.xml
          # 各密度 mipmap（Android 7 及以下使用）—— cp src/. dst/ 把内容直接放进 dst
          cp -r assets/icons/mipmap-mdpi/. android/app/src/main/res/mipmap-mdpi/
          cp -r assets/icons/mipmap-hdpi/. android/app/src/main/res/mipmap-hdpi/
          cp -r assets/icons/mipmap-xhdpi/. android/app/src/main/res/mipmap-xhdpi/
          cp -r assets/icons/mipmap-xxhdpi/. android/app/src/main/res/mipmap-xxhdpi/
          cp -r assets/icons/mipmap-xxxhdpi/. android/app/src/main/res/mipmap-xxxhdpi/
          # adaptive icon foreground（Android 8+ 使用）
          cp -r assets/icons/drawable-mdpi/. android/app/src/main/res/drawable-mdpi/
          cp -r assets/icons/drawable-hdpi/. android/app/src/main/res/drawable-hdpi/
          cp -r assets/icons/drawable-xhdpi/. android/app/src/main/res/drawable-xhdpi/
          cp -r assets/icons/drawable-xxhdpi/. android/app/src/main/res/drawable-xxhdpi/
          cp -r assets/icons/drawable-xxxhdpi/. android/app/src/main/res/drawable-xxxhdpi/
          # adaptive icon XML（背景改为新图标，避免 Flutter 默认蓝色背景）
          cp -r assets/icons/mipmap-anydpi-v26/. android/app/src/main/res/mipmap-anydpi-v26/
      - name: Patch Android project
        run: python3 scripts/patch_android.py
      - run: flutter pub get
      - name: Analyze Dart
        id: analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log
      - name: Surface analyze error
        if: failure() && steps.analyze.outcome == 'failure'
        run: |
          {
            echo "## ❌ flutter analyze failed:"
            echo '```'
            cat analyze.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::flutter analyze failed: $(cat analyze.log | tr '\n' ' ' | cut -c1-4000)"
      - name: Build APK
        id: build
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log
      - name: Surface build error
        if: failure() && steps.build.outcome == 'failure'
        run: |
          {
            echo "## ❌ flutter build failed — last 80 lines of log:"
            echo '```'
            tail -n 80 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::flutter build failed: $(tail -n 40 build.log | tr '\n' ' ' | cut -c1-4000)"
      - name: Rename APK
        if: success()
        run: |
          tag="${GITHUB_REF_NAME#v}"
          src="build/app/outputs/flutter-apk/app-release.apk"
          dst="build/app/outputs/flutter-apk/jizhang-${tag}.apk"
          cp "$src" "$dst"
          echo "apk=$dst" >> "$GITHUB_OUTPUT"
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jizhang-apk
          path: build/app/outputs/flutter-apk/jizhang-*.apk
      - name: Publish to GitHub Release
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/jizhang-*.apk
          generate_release_notes: true
