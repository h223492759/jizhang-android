name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
      - name: Generate Android runner
        run: |
          flutter create --no-pub --platforms=android _gen_tmp
          cp -r _gen_tmp/android .
          rm -rf _gen_tmp
      - name: Apply custom app icons
        run: |
          # 完整圆角矩形 PNG 图标（原图 100% + 圆角），不使用 adaptive icon
          # （adaptive icon 会被 launcher 按圆形/squircle 裁切，导致图标显示不全）
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -f android/app/src/main/res/drawable/ic_launcher_foreground.xml \
                android/app/src/main/res/drawable-v21/ic_launcher_foreground.xml
          # 各密度 mipmap（cp src/. dst/ 把内容直接放进 dst）
          cp -r assets/icons/mipmap-mdpi/. android/app/src/main/res/mipmap-mdpi/
          cp -r assets/icons/mipmap-hdpi/. android/app/src/main/res/mipmap-hdpi/
          cp -r assets/icons/mipmap-xhdpi/. android/app/src/main/res/mipmap-xhdpi/
          cp -r assets/icons/mipmap-xxhdpi/. android/app/src/main/res/mipmap-xxhdpi/
          cp -r assets/icons/mipmap-xxxhdpi/. android/app/src/main/res/mipmap-xxxhdpi/
      - name: Apply auto-record native code
        run: |
          # 自动记账：通知监听 + 队列，复制进生成的 android 工程（包名 com.example.u_gen_tmp）
          KDIR=android/app/src/main/kotlin/com/example/u_gen_tmp
          mkdir -p "$KDIR"
          cp -f android_native/MainActivity.kt "$KDIR/MainActivity.kt"
          cp -f android_native/AutoRecordListenerService.kt "$KDIR/AutoRecordListenerService.kt"
      - name: Patch Android project
        run: python3 scripts/patch_android.py
      - run: flutter pub get
      - name: Analyze Dart
        id: analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log
      - name: Surface analyze error
        if: failure() && steps.analyze.outcome == 'failure'
        run: |
          {
            echo "## ❌ flutter analyze failed:"
            echo '```'
            cat analyze.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::flutter analyze failed: $(cat analyze.log | tr '\n' ' ' | cut -c1-4000)"
      - name: Build APK
        id: build
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log
      - name: Surface build error
        if: failure() && steps.build.outcome == 'failure'
        run: |
          {
            echo "## ❌ flutter build failed — last 80 lines of log:"
            echo '```'
            tail -n 80 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::flutter build failed: $(tail -n 40 build.log | tr '\n' ' ' | cut -c1-4000)"
      - name: Rename APK
        if: success()
        run: |
          tag="${GITHUB_REF_NAME#v}"
          src="build/app/outputs/flutter-apk/app-release.apk"
          dst="build/app/outputs/flutter-apk/jizhang-${tag}.apk"
          cp "$src" "$dst"
          # APP 图标预览图：随 Release 一起发布，GitHub 会为图片资产显示缩略图
          cp assets/icons/mipmap-xxxhdpi/ic_launcher.png build/app/outputs/flutter-apk/app-icon.png
          echo "apk=$dst" >> "$GITHUB_OUTPUT"
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jizhang-apk
          path: |
            build/app/outputs/flutter-apk/jizhang-*.apk
            build/app/outputs/flutter-apk/app-icon.png
      - name: Publish to GitHub Release
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/jizhang-*.apk
            build/app/outputs/flutter-apk/app-icon.png
          generate_release_notes: true
          body: |
            ## 📱 记账本 Android
            ![APP 图标](https://github.com/h223492759/jizhang-android/releases/download/${{ github.ref_name }}/app-icon.png)

            点击上方 APK 文件下载安装；`app-icon.png` 为应用图标预览。
