name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
      - name: Generate Android runner
        run: |
          flutter create --no-pub --platforms=android _gen_tmp
          cp -r _gen_tmp/android .
          rm -rf _gen_tmp
      - name: Patch Android project
        run: python3 scripts/patch_android.py
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build APK
        id: build
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log
      - name: Surface build error
        if: failure()
        run: |
          {
            echo "## ❌ flutter build failed — last 80 lines of log:"
            echo '```'
            tail -n 80 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # backup channel: emit as a single-line error annotation (readable via Checks API)
          echo "::error::flutter build failed: $(tail -n 40 build.log | tr '\n' ' ' | cut -c1-4000)"
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish to GitHub Release
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
