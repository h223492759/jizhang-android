name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
      - name: Generate Android runner
        run: |
          flutter create --no-pub --platforms=android _gen_tmp
          cp -r _gen_tmp/android .
          rm -rf _gen_tmp
      - name: Allow cleartext (LAN http) & set app label
        run: |
          python3 - <<'PY'
          import re
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          s=re.sub(r'android:label="[^"]*"', 'android:label="记账本"', s)
          if 'usesCleartextTraffic' not in s:
              s=s.replace('<manifest', '<manifest android:usesCleartextTraffic="true"', 1)
          open(p,'w',encoding='utf-8').write(s)
          print('manifest patched')
          PY
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
