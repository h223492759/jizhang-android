name: jizhang_android
description: 记账本 - 安卓客户端（复刻鲨鱼记账交互，对接 jizhang 后端）
publish_to: 'none'
# v2.2.19：目标页顶部两 tab 间隙居中修正 + 「更新资产和负债」按最后一次保存值预填（同步 web v260915-2227）
#   - 目标页：AppBar 改为「返回(48) + Expanded(TabBar) + 占位(48)」对称结构 —— 中间 Expanded 的中心
#     即画面中心，两个 tab 各占一半宽度，二者间隙精确落在画面正中（此前两 tab 整体偏左）
#   - 目标页「更新资产和负债」：预填改为「最后一次保存的金额」（服务端 GET /savings 新增
#     last_amount/last_amount_ymd）——历史回填只写快照、不改当前余额，用当前余额预填会显示更早的旧值，
#     与页面顶部「当前净资产」对不上；弹窗顶部提示「已按 YYYY-MM-DD 最后一次保存的金额预填」
# v2.2.18：预算「复制预算」+ 目标页 tab 居中 + 更新资产和负债取最新保存值
#   - 预算：年份切换行最右侧加「复制预算」→ 选来源年份，把该年「年度总预算 + 分类预算」
#     一次性复制到当前年份（覆盖式，语义同网页端 POST /budgets/copy）；当前年已有预算时先确认覆盖
#   - 目标页：AppBar centerTitle=true —— 返回按钮位置不变，「存款/资金细则」两个 tab 作为整体居中
#     （两个 tab 中间的间隙落在画面正中）
#   - 目标页「更新资产和负债」：此前弹窗读的是进页面那一刻的本地旧镜像，不是最新一次保存的数据 →
#     ①LocalFirstApi.getSavings() 改为先刷新服务端资金细则再读（与 getBudgets 同口径）
#     ②打开弹窗前再拉一次 ③输入框改动后下方资产/负债/净资产合计实时重算
# v2.2.17：发现页搜索 + 我的页布局 + 黑名单入口 + 目标/账单/预算样式（同步 web v260913-0044）
#   - 自动记账设置页新增「忽略商户名单（拉黑）」：流水详情「拉黑删」写入的 auto_ignore_merchants
#     此前只能写不能看 → 现可查看/单条解除/清空
#   - 发现页 AppBar「本月分析」文字按钮 → 放大镜（进关键字搜索流水，同网页端 LIKE description）；
#     「本月分析」移入空态「试试这些」作为第一个 chip
#   - 我的页：8 个常用功能改「一行 4 图标+文字」×2 行；开源地址移入版本信息（AI 记账下面一行，
#     右对齐蓝色下划线，点击复制）；昵称下方两行统计（首次记账时间 / 流水总笔数）
#   - 目标页：TabBar 提到 AppBar 同一行（toolbarHeight 48），顶部省下约 46px
#   - 账单「月账单」/预算：年份切换改用水电气样式（← 年份 →，点文字仍可弹年份选择）；
#     水电气翻年上限由「当前年+3」改为「当前年」（未来年份不可切换）
#   - 预算「选择分类（添加预算）」：已设过预算的分类置灰（onPressed=null）并标「已添加」
# v2.2.16：水电气规则 cover_json 显式覆盖账期（服务端 v260910-0312 语义，同步 web）
#   - 规则新增「出账窗口 → 覆盖账期」编辑器：水/气双条件(1-15→上月+上上月；16-31→当月+上月)，
#     电=上月单月，物业=季内任意日归自然季度；窗口互斥 → 一笔流水唯一命中一个覆盖区间
#   - 金额整额显示在覆盖账期末月（bill_end）；用量均摊不变；gas 年累计按账单结束年
#   - 老规则无 cover 时按类型默认语义兜底显示（不建编辑器行）
# v2.2.10：水电气规则起点前年份不可切换 + 月份全量显示/金额保持账单月（服务端 v260910 语义）
#   - 服务端 /utility/months 恢复全年 12 月全量（v2.2.6 的 startM..endM 规则裁剪把真实账单月份裁没，
#     用户反馈「很多月看不到」）；金额全额落在账单起始月 bill_start（= 缴费/流水月），双月/物业
#     账单覆盖的其余月金额 0、用量均摊保留（用户确认「金额保持账单月，用量均摊」）
#   - 服务端 /utility/years 过滤规则起点前年份（minRuleYear）→ 年份列表不再含 2024 等
#   - 安卓：翻年下限 = /years 升序首年；月模式也拉 years 维护 _minYear；左箭头 _year<=_minYear 禁用；
#     切类型时 _year 钳制到新类型 minYear（避免停在不可达年份）；渲染层无需改动（服务端数据自动生效）
# v2.2.24：修「支付成功结果页被误判为历史明细页」漏记 + 运行日志 50→300 条并同步到后台（同步 web v260919-1828 起）
#   - 无障碍通道两处漏记根因（2026-09-19 用户日志定位）：
#     ① 顶部列表词用 contains 匹配短导航词 →「回首页」命中「首页」→ 整笔支付被当成浏览旧账单丢弃；
#        改为「短导航词整段相等 + 列表特征长词 contains」，且顶部出现完成态词（支付成功…）时
#        一律按结果页优先，不做列表页跳过
#     ② 成功页常把「¥」与数字拆成两个可访问性节点 → 严格正则取不到金额 → 被判「窗口内无金额」；
#        新增宽松提取（¥ 后允许 ≤4 个分隔符、不跨汉字，防把余额当金额）+ 窗口由 ±30 扩到 ±60 兜底
#   - 运行日志留存上限 50 → 300（Kotlin AutoRecordStore.LOG_MAX 与 Flutter _kLogMax 双端同步）；
#     设置页文案改「最新 300 条 · 自动同步到后台」，清空按钮改「清空本机」
#   - 日志同步到服务端：启动/回前台/轮询时顺带整包上传（≥60s 节流、仅在有新日志时），
#     服务端 client_logs 按 (账本, 设备, 时间戳, 行) 唯一 → 幂等，客户端无需维护上传游标；
#     网页端新增「记账日志」页可按账本/设备/关键词回查，后台不限条数长期留存
# v2.2.25：修「账户会登出」（同步 web 待定）
#   - 「切换服务器」页点一下**当前正在用的那台**也会走 selectServer → 清 token → 立刻登出；
#     我的页宫格就有「切换服务器」入口，进去看一眼地址就会掉线 → 同地址改为直接返回不处理
#   - 删除正在使用的服务器会静默登出 → 加确认弹窗；删完列表为空才允许清服务器+登录态
#   - 冷启动先闪「服务器/登录」页（登录态是异步读盘，而 RootRouter 同步判 hasServer/hasToken）
#     → 新增 restoring 过渡页，读完再判；_load 加 try/catch + finally（异常也不会卡在过渡页）
#   - 登录态双写：除 SharedPreferences 外再存一份私有文件镜像（login_state.json），
#     SP 丢失时启动自动恢复；只有主动退出/切换服务器才删镜像
#   - Storage 读写逐项容错 + 用户/账本模型 id 容错：单个字段坏掉不再中断整个启动恢复
#   - 登录态事件（登录成功/启动载入/自动恢复/被清）写进运行日志并同步后台，便于事后定位
# v2.2.28：修「弱网流水被静默丢弃 / 编辑没反应」+ 弱网保存零等待
#   - 出站队列 op 名错位（致命）：入队用 create/update/delete，重放却只认
#     createFlow/updateFlow/deleteFlow → 流水三类操作全部落入 default 被静默
#     丢弃，弱网/离线时记的账在下次同步后消失（67.31 事故根因之一）
#   - 负 id 流水编辑/删除走本地路径：旧版拿负数临时 id 直发 PUT/DELETE 服务器
#     → 404「改分类半天没反应」；现改为改写队列 create body / 撤回队列
#   - 对账删除加 id > 0 保护：负 id 本地行（待补传）不再被「服务器已删」清掉
#   - 流水写入本地先行：记一笔/改分类/删除立即写本地镜像生效，推送后台补传
#     （旧版在线直发要等满超时，弱网下「半天没反应」）
#   - 补传永久失败（400/404）跳过并记日志，防毒丸卡死整个队列
# v2.2.27：修复「成员记的账一直同步不到」
#   - 同步指纹改为【拉取全部成功后】才落盘：旧版先存指纹再拉取，拉取一旦中途
#     失败（网络抖动/任一请求超时），指纹已是「最新」，之后每次同步都被
#     unchanged:true 跳过，家庭成员新增的流水永远拉不到，直到服务器数据再次
#     变化（如自己记一笔）才解锁
#   - 同步引擎接入运行日志（完成/跳过/失败三态，失败 5 分钟节流），后台
#     「记账日志」可直接看到同步行为，不再零日志盲查
# v2.2.26：自动记账收支方向判错 + 首页改分类支持切收支
#   - 修「支出被记成收入」：方向判定改为「标题/命中关键词优先 + 支出完成态词优先 + 默认支出」。
#     旧写法在整段文本里找裸词「收入/收款/入账/到账」，无障碍通道送来的是**整页文本**，
#     页面里的营销到账文案（京东、美团「…已到账」）会把支出翻成收入
#   - 「到账」单独降级为弱信号：命中营销词表（限时/特惠/优惠…）时不算收入
#   - 记账日志补方向（「已记账：支出/收入 …」），便于事后在「记账日志」里核对方向判错
#   - 首页点分类图标改分类：弹窗内可直接切「支出/收入」，切过去后金额符号随之变化、数值不变
version: 2.2.28+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.4.3+1
  flutter_riverpod: ^2.5.1
  path_provider: ^2.1.0
  shared_preferences: ^2.2.3
  fl_chart: ^0.68.0
  intl: ^0.19.0
  package_info_plus: ^8.0.0
  sqflite: ^2.3.3
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
