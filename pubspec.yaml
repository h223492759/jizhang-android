name: jizhang_android
description: 记账本 - 安卓客户端（复刻鲨鱼记账交互，对接 jizhang 后端）
publish_to: 'none'
# v2.2.7：修复自动记账误记（用户 2026-09-09 早上 8-9 点京东「到账 ¥98」误记为收入 60/20、支付宝「服务通知/钱已到账 ¥0」/微信「兰夕 ¥0」陌生人红包误记）——
# ① 强信号词收紧：移除单字「到账/入账/收款/转账」（太宽，命中京东金融营销到账/支付宝服务通知），只保留组合词「收款到账/收款成功/入账成功/入账通知/已到账」等。
# ② 0 元 + 无 5s 配对时按营销黑名单再次过滤：「服务通知/钱已到账/红包已领取/领到红包/已收下红包/优惠已发放/已发券/抽奖/获赠/已到卡/充值成功」命中直接跳过（不在黑名单的 0 元仍走"待录入"保底）。
# ③ a11y 侧加 pkg 维度黑名单：京东/京东系/支付宝 app 的「到账/入账」单字=营销到账，跳过；招行碰一碰结果页（pkg=com.cmbchina.cc）的「到账」仍可识别。
# ④ Flutter _parse 与 native strongKw 词表同步保持一致（v260903 教训）。
# v2.2.6：与网页端 v2.2.6 同批水电气改造——
# ①物业费规则「每笔覆盖月数」加 1/3/4/6/12 月快捷 ChoiceChip（燃气不让改默认 2 月）
# ②趋势表分型：物业=金额柱(蓝)、水/电/燃气=用量柱(绿)；档位虚线用 fl_chart extraLinesData HorizontalLine(第2档橙 / 第3档红)无档位不画
# ③月份/年份行 4 列等距 Row+Expanded(flex 10/14/10/14)：[月份-用量-档位-金额]；档位列第1档透明占位保持对齐
# ④缴费规则未涉及的年月不显示：服务端 computeMonths 按 rule.effective_from/to 裁剪，本地无渲染层改动
# ⑤趋势表横轴年份升序由服务端 /utility/years 端点保证（左小右大）
# ⑥tooltip 按 type 变：物业=¥金额、水电气=用量+单位；档位提示不变
# v2.2.4：离线可用性修复——水电气用量页/规则页与钱包明细、定存明细/历史在断网或服务器不可达时回退本地缓存（读缓存优先，无缓存才提示加载失败），页面顶部提示「网络不可用，显示上次缓存数据」
# v2.2.3：①「水电气用量」优化——顶部可切月/年视图+年度趋势图+按年汇总；账单详情「优惠金额」改「实际账单金额」（优惠=实际-实付自动算）；新建规则可选关联消费分类（不限于住房）；双月均摊每期金额一致（round2 平分）②自动记账5秒窗口跨支付方式聚合（同额只记一条/异额各记/全无金额按最早渠道一条）+ 仅记账成功弹一次「已记账」（去掉逐条「已加入待处理」弹窗）③首页改分类底部选择器最后一行可滚到底 ④「我的」页加 GitHub 开源地址
# v2.2.2：新增「水电气用量」——我的页入口；水/电/燃气/物业 4 类每月用量列表（第2档橙黄高亮、第3档红警示、覆盖月均摊整数）、账单详情补优惠/改用量/删除、手动添加账单、扫描历史回填；规则设置页（生效起止/覆盖月数/阶梯编辑/电费夏季档/燃气年累计/物业月费，模板=广州现行档位）
# v2.2.1：修复操作日志为空——流水增/改/删与回收站恢复/彻底删除补写本地操作日志(ops_log)
#   （原只有存款细则/定期模板等 _offlineWrite 路径记日志，日常记一笔/改删流水从不记录）
# v2.2.0：①首页触底翻上月加防呆（拉到底停顿后再上拉才翻，1号流水不再被误带走）+ 历史月下拉只前进一月（不再直接跳最新月）②首页顶部分区（日期/收支+5功能按钮）固定不随列表滚动 ③图表页月/年选择区固定 ④自动记账支持勾选支付方式并扩展抖音/京东/美团支付
# 回滚 v1.5.6=tag v260903-0843 仍有效；v2.1.0=tag v260905-2212
