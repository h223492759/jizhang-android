name: jizhang_android
description: 记账本 - 安卓客户端（复刻鲨鱼记账交互，对接 jizhang 后端）
publish_to: 'none'
# v2.2.1：修复操作日志为空——流水增/改/删与回收站恢复/彻底删除补写本地操作日志(ops_log)
#   （原只有存款细则/定期模板等 _offlineWrite 路径记日志，日常记一笔/改删流水从不记录）
# v2.2.0：①首页触底翻上月加防呆（拉到底停顿后再上拉才翻，1号流水不再被误带走）+ 历史月下拉只前进一月（不再直接跳最新月）②首页顶部分区（日期/收支+5功能按钮）固定不随列表滚动 ③图表页月/年选择区固定 ④自动记账支持勾选支付方式并扩展抖音/京东/美团支付
# 回滚 v1.5.6=tag v260903-0843 仍有效；v2.1.0=tag v260905-2212
version: 2.2.1+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.4.3+1
  flutter_riverpod: ^2.5.1
  path_provider: ^2.1.0
  shared_preferences: ^2.2.3
  fl_chart: ^0.68.0
  intl: ^0.19.0
  package_info_plus: ^8.0.0
  sqflite: ^2.3.3
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
