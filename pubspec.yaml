name: jizhang_android
description: 记账本 - 安卓客户端（复刻鲨鱼记账交互，对接 jizhang 后端）
publish_to: 'none'
# v2.2.16：水电气规则 cover_json 显式覆盖账期（服务端 v260910-0312 语义，同步 web）
#   - 规则新增「出账窗口 → 覆盖账期」编辑器：水/气双条件(1-15→上月+上上月；16-31→当月+上月)，
#     电=上月单月，物业=季内任意日归自然季度；窗口互斥 → 一笔流水唯一命中一个覆盖区间
#   - 金额整额显示在覆盖账期末月（bill_end）；用量均摊不变；gas 年累计按账单结束年
#   - 老规则无 cover 时按类型默认语义兜底显示（不建编辑器行）
# v2.2.10：水电气规则起点前年份不可切换 + 月份全量显示/金额保持账单月（服务端 v260910 语义）
#   - 服务端 /utility/months 恢复全年 12 月全量（v2.2.6 的 startM..endM 规则裁剪把真实账单月份裁没，
#     用户反馈「很多月看不到」）；金额全额落在账单起始月 bill_start（= 缴费/流水月），双月/物业
#     账单覆盖的其余月金额 0、用量均摊保留（用户确认「金额保持账单月，用量均摊」）
#   - 服务端 /utility/years 过滤规则起点前年份（minRuleYear）→ 年份列表不再含 2024 等
#   - 安卓：翻年下限 = /years 升序首年；月模式也拉 years 维护 _minYear；左箭头 _year<=_minYear 禁用；
#     切类型时 _year 钳制到新类型 minYear（避免停在不可达年份）；渲染层无需改动（服务端数据自动生效）
version: 2.2.16+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.4.3+1
  flutter_riverpod: ^2.5.1
  path_provider: ^2.1.0
  shared_preferences: ^2.2.3
  fl_chart: ^0.68.0
  intl: ^0.19.0
  package_info_plus: ^8.0.0
  sqflite: ^2.3.3
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
